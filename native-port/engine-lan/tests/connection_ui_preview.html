<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connection UI preview</title>
<style>html,body{margin:0;min-height:100%;background:#13202a;color:#e9f2f6;font:14px system-ui}body{min-height:100vh;background:radial-gradient(ellipse at 20% 80%,#385755 0,transparent 50%),radial-gradient(ellipse at 80% 20%,#283a54 0,transparent 60%),linear-gradient(135deg,#101b25,#1c2a35)}.qa-controls{position:fixed;left:24px;bottom:24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:70vw;padding:12px;border-radius:14px;background:#101923db}.qa-controls button{font:inherit;color:#d8e9f0;background:#ffffff12;border:1px solid #ffffff24;border-radius:8px;padding:8px 12px}.qa-controls label{font-size:11px;color:#aabcc7}.qa-hud{position:fixed;right:20px;top:56px;border:1px solid #d7e6eb38;border-radius:50%;height:52px;width:52px;background:#0911194d;color:white;display:grid;place-items:center;font-size:25px}.qa-info{position:fixed;left:24px;top:22px;padding:9px 13px;border:1px solid #ffffff20;background:#0911196d;border-radius:10px;color:#d4e4ed;font-size:12px}</style>
<div class="qa-hud" aria-label="Mod Manager position reference"><svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true"><path fill="currentColor" d="M20 13h-2a3 3 0 1 0 0 6h2v3H2v-7h2a3 3 0 1 0 0-6H2V2h7v2a3 3 0 1 0 6 0V2h5z"/></svg></div><div class="qa-info">UI preview · no game or network connection running</div>
<nav class="qa-controls" aria-label="Preview scenarios"><label>PREVIEW</label><button id="connected">Connected</button><button id="lost">Disconnected</button><button id="restored">Host restored</button><button id="save-error">Save issue</button><button id="other-panel">Open another panel</button></nav>
<script src="/zema-lab/connection-ui.js"></script><script>
const ui=ZemaConnectionUI.mount({room:'LOS-SANTOS',connection:'LAN',relay:'ws://192.168.1.33:47540/engine-lan',lobbyRole:'join'});
ui.saveOutput.textContent='Character save stored and read by the game.';ui.inputStatus('Keyboard and mouse');
ui.reconnect.onclick=()=>ui.render('connecting',{technical:'Preview only. No network request was sent.'});ui.rejoin.onclick=()=>{};
document.getElementById('connected').onclick=()=>ui.render('connected');document.getElementById('lost').onclick=()=>ui.render('disconnected',{technical:'Admission timed out (diagnostic example only).'});document.getElementById('restored').onclick=()=>{ui.rejoin.hidden=false;ui.render('recovered',{showGuide:true});};document.getElementById('save-error').onclick=()=>ui.render('profile-error');document.getElementById('other-panel').onclick=()=>document.dispatchEvent(new CustomEvent('zema-ui-panel-open',{detail:'other'}));
</script>
