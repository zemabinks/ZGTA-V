[package]
name = "mugoat-online"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"

[features]
default = ["native-port"]
native-port = []
jit = []

[profile.release]
opt-level = 2

[[bin]]
name = "mugoat-server"
path = "src/server_main.rs"
